name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Known-good commit SHA to rebuild and redeploy
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate exact artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - name: Validate known-good rollback commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK_COMMIT: ${{ inputs.commit }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "${#ROLLBACK_COMMIT}" -eq 40
          test -z "${ROLLBACK_COMMIT//[0-9a-f]/}"
          git merge-base --is-ancestor "$ROLLBACK_COMMIT" origin/main
          test "$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-pages.yml/runs" -f head_sha="$ROLLBACK_COMMIT" -f status=success --jq '.workflow_runs | length')" -gt 0
      - name: Check out selected rollback commit
        if: github.event_name == 'workflow_dispatch'
        run: git checkout --detach "${{ inputs.commit }}"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke:artifact
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload exact validated artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    name: Deploy and verify production
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.commit || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify deployed portfolio
        run: npm run smoke:production -- "${{ steps.deployment.outputs.page_url }}"
